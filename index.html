<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bảng giá A3/A4/A6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d6f5a'/%3E%3Ctext x='32' y='42' font-size='26' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EA3%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1d6f5a">
<style>
:root{--bg:#fff;--fg:#1c1f1d;--bd:#d5dbd8;--hd:#e8efec;--ac:#1d6f5a;--sel:#cfe8df;--er:#fbd9d6;--wn:#fff1c2}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#161a18;--fg:#e6ebe8;--bd:#34403b;--hd:#232b28;--ac:#4fb597;--sel:#244a3f;--er:#5a2623;--wn:#5a4a14}}
:root[data-theme=dark]{--bg:#161a18;--fg:#e6ebe8;--bd:#34403b;--hd:#232b28;--ac:#4fb597;--sel:#244a3f;--er:#5a2623;--wn:#5a4a14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
#bar{display:flex;flex-wrap:wrap;gap:5px;padding:5px;border-bottom:1px solid var(--bd);align-items:center}
#bar b{font-size:12px;color:var(--ac);padding:0 2px}.sp{flex:1}
button,input.f{font:inherit;color:var(--fg);background:var(--hd);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;white-space:nowrap}
input.f{background:var(--bg);flex:1;min-width:90px;padding:6px 8px}
button:active{background:var(--sel)}.on1{background:var(--ac)!important;color:#fff!important}
#main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:3px 5px;background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.nm{white-space:normal}
th{position:sticky;top:0;z-index:3;background:var(--hd);white-space:normal;font-weight:600}
.fz{position:sticky;z-index:2}th.fz{z-index:4}
td.n{text-align:center;background:var(--hd)}
tr.s td{background:var(--sel)}tr.e td{background:var(--er)}tr.w td{background:var(--wn)}
td input.c{width:100%;font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:0}
.multi input.c{pointer-events:none}
#tabs{display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;border-radius:0;background:var(--bg);padding:7px 0;font-size:13px}
#tabs button.on{box-shadow:inset 0 2px 0 var(--ac);color:var(--ac);font-weight:700}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:56px;max-width:92vw;background:#222;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;z-index:20}
#fm{display:none;position:fixed;left:4px;right:4px;z-index:15;background:var(--bg);border:1px solid var(--ac);border-radius:10px;padding:5px;gap:5px;flex-wrap:wrap;box-shadow:0 3px 14px #0005}
#pop{display:none;position:fixed;inset:0;z-index:30}
#pop .bk{position:absolute;inset:0;background:#0006}
#pop .sh{position:absolute;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:var(--bg);padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
#pop h4{margin:0 0 8px}#pop .sh>button{display:block;width:100%;text-align:left;margin-bottom:6px;padding:11px}
.ci{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.ci span{flex:1}
</style></head><body>
<div id="bar"></div><div id="main"></div><div id="tabs"></div><div id="fm"></div><div id="pop"></div><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzMixo2qTm43242LjvrH6E_ypONCjbRL-qUdmNKznr3CJut25HXcQSvMhFce4T3NSYe/exec';
const $=s=>document.querySelector(s),LS=localStorage;
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const fm=v=>typeof v=='number'?Math.round(v).toLocaleString('vi-VN'):(v==null?'':v),esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const blank=()=>({sku:'',e:null,n:'1a6',err:''}),clone=o=>JSON.parse(JSON.stringify(o));
if(LS.theme)document.documentElement.dataset.theme=LS.theme;
let D={idx:{},list:[]},S={tab:'Sheet3',A3:[],A4:[],A6:[]},sel=new Set(),chk=new Set(),clip=[],hist=[],fut=[],tabs=[],q1='',q2='',multi=0,Z={},C3;
try{Z=JSON.parse(LS.z||'{}')}catch(e){}
try{C3=JSON.parse(LS.c3)}catch(e){}
if(!Array.isArray(C3))C3=['sku','ten','dvt','goc','gia','qt','ad','v','nh'].map((k,i)=>({k,f:i==0?1:0}));
const H3={sku:['SKU',e=>e.sku,70],ten:['Tên hàng',e=>e.ten,270],dvt:['ĐVT',e=>e.dvt,60],goc:['Giá gốc',e=>fm(e.goc),90],gia:['Giá KM',e=>fm(e.gia),90],qt:['Điều kiện / thẻ lệ KM',e=>e.qt,170],ad:['Thời hạn áp dụng',e=>e.ad,210],v:['Vendor',e=>e.v,80],nh:['Nhãn hiệu',e=>e.nh,130]};
try{if(LS.data)parse(JSON.parse(LS.data))}catch(e){}
try{const o=JSON.parse(LS.a3||'{}');['A3','A4','A6'].forEach(k=>S[k]=o[k]||Array.from({length:20},blank));S.tab=o.tab||'Sheet3'}catch(e){['A3','A4','A6'].forEach(k=>S[k]=Array.from({length:20},blank))}
const cur=()=>JSON.stringify([S.A3,S.A4,S.A6]);
function save(){LS.a3=JSON.stringify({A3:S.A3,A4:S.A4,A6:S.A6,tab:S.tab})}
function snap(){hist.push(cur());if(hist.length>200)hist.shift();fut=[]}
function undo(){if(!hist.length)return;fut.push(cur());[S.A3,S.A4,S.A6]=JSON.parse(hist.pop());sel.clear();draw()}
function redo(){if(!fut.length)return;hist.push(cur());[S.A3,S.A4,S.A6]=JSON.parse(fut.pop());sel.clear();draw()}
function msg(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>e.style.display='none',2800)}
function parse(v){D={idx:{},list:[]};let cv='',cn='';
 v.forEach(r=>{const s=String(r[1]).trim();
  if(/^\d{7}$/.test(s)){const e={sku:s,ten:r[2],dvt:r[3],goc:r[4],gia:r[5],qt:r[6],ad:r[7],nh:r[8]||cn,v:String(r[0]||cv).trim()};D.list.push(e);
   const L=D.idx[s]||(D.idx[s]=[]);if(!L.some(x=>x.gia==e.gia&&x.qt==e.qt))L.push(e)}
  else if(s){const a=/VENDOR:\s*(\d+)/i.exec(s),b=/NH[ÃA]N HI[ỆE]U:\s*(.+)$/i.exec(s);if(a)cv=a[1];if(b)cn=b[1].trim()}})}
async function pickTab(){try{if(!tabs.length)tabs=(await (await fetch(API+'?action=tabs')).json()).tabs||[]}catch(e){}
 if(tabs.length)popItems('Chọn tab dữ liệu',tabs.map(t=>[t+(t==LS.src?' ✓':''),()=>load(t)]));
 else{const t=prompt('Không đọc được danh sách tab. Nhập đúng tên tab:',LS.src||'');if(t)load(t.trim())}}
async function load(tab){if(tab)LS.src=tab;draw();if(!LS.src)return pickTab();
 try{msg('Đang nạp tab '+LS.src+'…');const j=await (await fetch(API+'?action=read&tab='+encodeURIComponent(LS.src))).json();
  if(j.error)throw j.error;LS.data=JSON.stringify(j.values);parse(j.values);msg('Đã nạp '+D.list.length+' dòng từ tab "'+LS.src+'"')}
 catch(e){msg('Chưa kết nối được Google Sheet, đang dùng dữ liệu đã lưu')}
 draw()}
function fill(sh,i,sku){const R=S[sh],r=R[i];sku=String(sku).trim();Object.assign(r,{sku,e:null,err:'',warn:0,tm:0,g:undefined});
 if(!sku)return 0;const L=D.idx[sku];if(!L){r.err='không có trong file';return 0}
 if(L.length==1){r.e=L[0];return 0}
 if(L.every(x=>/Thành viên/i.test(x.qt))){r.e=L[0];L.slice(1).forEach((x,k)=>R.splice(i+1+k,0,{sku,e:x,n:'1a6',err:''}));return L.length-1}
 const m=prompt('SKU '+sku+' có '+L.length+' giá khác nhau. Nhập số để chọn:\n'+L.map((x,k)=>(k+1)+') '+x.gia+' | '+(x.qt||'')+' | '+x.ad).join('\n'),'1');
 r.e=L[Math.max(0,(+m||1)-1)]||L[0];r.warn=1;return 0}
function pasteSkus(sh,i,text){const ls=text.split(/\r?\n/).map(s=>s.trim());while(ls.length&&!ls[ls.length-1])ls.pop();
 snap();let p=i;ls.forEach(l=>{while(p>=S[sh].length)S[sh].push(blank());p+=1+fill(sh,p,l)});save();draw()}
const bn=e=>{if(!e||!e.nh||/^(SELECT|HAPPY|FINEST|COOP)/i.test(e.nh))return'';const p=String(e.nh).split('/').map(s=>s.trim());return p[p.length-1]};
function grp(R,sh){const o=[];let i=0;while(i<R.length){if(!R[i].sku){o[i]={};i++;continue}
 let j=i;while(j<R.length&&R[j].sku)j++;const n=j-i,bs=new Set();for(let k=i;k<j;k++){const b=bn(R[k].e);if(b)bs.add(b)}
 const suf=n>=5&&bs.size>=2;for(let k=i;k<j;k++){const b=bn(R[k].e);o[k]={t:suf&&b?' ('+b+')':'',g:k==i&&n>=2?'ghép '+n+' mã 2'+sh.toLowerCase():''}}i=j}return o}
/* ---------- khung bảng ---------- */
const W=(h,vals,cap)=>Math.min(cap,Math.round(Math.max(Math.min(String(h).length,9),...vals.map(v=>String(v==null?'':v).length))*7.3+16));
function lay(cols){let x=0;return cols.map(c=>{const o={w:c.w,l:c.fz?x:null};if(c.fz)x+=c.w;return o})}
const st=(o,x)=>' class="'+(o.l!=null?'fz ':'')+(x||'')+'"'+(o.l!=null?' style="left:'+o.l+'px"':'');
const head=(cols,L,hs)=>'<table style="width:'+cols.reduce((a,c)=>a+c.w,0)+'px"><colgroup>'+cols.map(c=>'<col style="width:'+c.w+'px">').join('')+'</colgroup><tr>'+hs.map((h,j)=>'<th'+st(L[j])+'>'+h+'</th>').join('')+'</tr>';
/* ---------- thanh trên ---------- */
function themeNext(){const n={undefined:'light',light:'dark',dark:''}[LS.theme||undefined];if(n){LS.theme=n;document.documentElement.dataset.theme=n}else{delete LS.theme;delete document.documentElement.dataset.theme}msg('Giao diện: '+(n=='light'?'sáng':n=='dark'?'tối':'theo hệ thống'))}
function pop(t,h,bind){const p=$('#pop');p.innerHTML='<div class="bk"></div><div class="sh"><h4>'+t+'</h4>'+h+'</div>';p.style.display='block';p.querySelector('.bk').onclick=()=>p.style.display='none';bind&&bind(p)}
function popItems(t,its){pop(t,its.map((x,j)=>'<button data-j="'+j+'">'+x[0]+'</button>').join(''),p=>p.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{p.style.display='none';its[+b.dataset.j][1]()}))}
function colsPop(){pop('Cột Sheet3: chọn cột cố định và thứ tự',C3.map((c,i)=>'<div class="ci"><span>'+H3[c.k][0]+'</span><label><input type="checkbox" data-f="'+i+'"'+(c.f?' checked':'')+'> cố định</label><button data-m="'+i+',-1">▲</button><button data-m="'+i+',1">▼</button></div>').join(''),p=>{
 p.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{C3[+x.dataset.f].f=x.checked?1:0;LS.c3=JSON.stringify(C3);colsPop();list()});
 p.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{const[i,d]=x.dataset.m.split(',').map(Number),j=i+d;if(j<0||j>=C3.length)return;[C3[i],C3[j]]=[C3[j],C3[i]];LS.c3=JSON.stringify(C3);colsPop();list()})})}
function bar(){const sh=S.tab,b=$('#bar');
 if(sh=='Sheet3'){b.innerHTML='<input class="f" id="q1" placeholder="Tìm tên / SKU" value="'+esc(q1)+'"><input class="f" id="q2" placeholder="Vendor / nhãn" value="'+esc(q2)+'"><b id="cnt"></b>'+['A3','A4','A6'].map(x=>'<button data-p="'+x+'">→'+x+'</button>').join('')+'<button id="mn">⋯</button>';
  $('#q1').oninput=e=>{q1=e.target.value;list()};$('#q2').oninput=e=>{q2=e.target.value;list()};
  b.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>push(x.dataset.p));
  $('#mn').onclick=()=>popItems('Tùy chọn',[['Cột: cố định và thứ tự',colsPop],['Đổi tab dữ liệu (đang dùng: '+(LS.src||'chưa chọn')+')',pickTab],['Giao diện sáng / tối / hệ thống',themeNext]])}
 else{b.innerHTML='<button id="u">↶</button><button id="r">↷</button><button id="mu" class="'+(multi?'on1':'')+'">Chọn nhiều</button><span class="sp"></span><button id="mn">⋯</button>';
  $('#u').onclick=undo;$('#r').onclick=redo;
  $('#mu').onclick=()=>{multi=!multi;sel.clear();hideFM();draw();msg(multi?'Chạm vào dòng để chọn hoặc bỏ chọn':'Đã tắt chọn nhiều')};
  $('#mn').onclick=()=>popItems('Tùy chọn',[['Chèn dòng trống ở cuối',()=>{snap();S[sh].push(blank());save();draw()}],['Thêm 10 dòng',()=>{snap();for(let i=0;i<10;i++)S[sh].push(blank());save();draw()}],['Xuất Excel (đợt 2)',()=>msg('Xuất Excel theo file gốc sẽ có ở đợt 2')],['Giao diện sáng / tối / hệ thống',themeNext]])}}
/* ---------- menu nổi ---------- */
function hideFM(){$('#fm').style.display='none'}
function selSorted(){return[...sel].sort((a,b)=>a-b)}
function ops(a){const sh=S.tab,R=S[sh],s=selSorted();if(!s.length)return;snap();const lo=s[0],hi=s[s.length-1];
 if(a=='cp'||a=='ct')clip=s.map(i=>clone(R[i]));
 if(a=='ct'||a=='del')S[sh]=R.filter((_,i)=>!sel.has(i));
 if(a=='clr')s.forEach(i=>R[i]=blank());
 if(a=='ov'){clip.forEach((c,k)=>{while(lo+k>=R.length)R.push(blank());R[lo+k]=clone(c)})}
 if(a=='insc')R.splice(lo,0,...clone(clip));
 if(a=='ia')R.splice(lo,0,...s.map(blank));
 if(a=='ib')R.splice(hi+1,0,...s.map(blank));
 if(a=='fd'){s.forEach(i=>{R[i].n=R[lo].n;R[i].g=R[lo].n})}
 if(a=='cp')hist.pop();
 sel.clear();hideFM();save();draw();msg(a=='cp'?'Đã chép '+clip.length+' dòng':a=='ct'?'Đã cắt '+clip.length+' dòng':'Xong')}
function showFM(i){const tr=$('tr[data-i="'+i+'"]');if(!tr)return;const f=$('#fm'),has=clip.length,A6=S.tab=='A6';
 const bt=[['ct','Cắt'],['cp','Chép'],has&&['ov','Dán thay'],has&&['insc','Chèn đã '+'chép/cắt'],['ia','Chèn dòng trên'],['ib','Chèn dòng dưới'],['clr','Xóa nội dung'],['del','Xóa dòng'],A6&&sel.size>1&&['fd','Điền ghi chú xuống'],['pk','Dán SKU'],!multi&&['mm','Chọn thêm']].filter(Boolean);
 f.innerHTML=bt.map(x=>'<button data-a="'+x[0]+'">'+x[1]+'</button>').join('');f.style.display='flex';
 const r=tr.getBoundingClientRect(),h=f.offsetHeight;f.style.top=Math.max(40,Math.min(innerHeight-h-50,r.bottom+4))+'px';
 f.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;
  if(a=='mm'){multi=1;hideFM();bar();$('#main').className='multi';return msg('Chạm thêm các dòng khác để chọn')}
  if(a=='pk')return navigator.clipboard.readText().then(t=>{hideFM();pasteSkus(S.tab,selSorted()[0],t)}).catch(()=>msg('Không đọc được bộ nhớ tạm. Chạm ô SKU rồi dán'));
  ops(a)})}
function rowTap(i){if(multi){sel.has(i)?sel.delete(i):sel.add(i)}else if(sel.size==1&&sel.has(i))sel.clear();else sel=new Set([i]);
 document.querySelectorAll('tr[data-i]').forEach(t=>t.classList.toggle('s',sel.has(+t.dataset.i)));sel.size?showFM(selSorted()[0]):hideFM()}
/* ---------- Sheet3 ---------- */
function flt(){const a=norm(q1).split(/\s+/).filter(Boolean),b=norm(q2).split(/\s+/).filter(Boolean);
 return D.list.filter(e=>{const x=norm(e.ten+' '+e.sku),y=norm(e.v+' '+e.nh);return a.every(w=>x.includes(w))&&b.every(w=>y.includes(w))})}
function list(){const F=flt().slice(0,300),ks=F.map(e=>D.list.indexOf(e)),all=ks.length&&ks.every(k=>chk.has(k));
 const cs=[...C3].sort((a,b)=>b.f-a.f),cols=[{w:36,fz:1}].concat(cs.map(c=>({w:W(H3[c.k][0],F.map(H3[c.k][1]),H3[c.k][2]),fz:c.f}))),L=lay(cols);
 const mn=$('#main'),sx=mn.scrollLeft,sy=mn.scrollTop;
 mn.className='';mn.innerHTML=head(cols,L,['<input type="checkbox" id="ta"'+(all?' checked':'')+'>'].concat(cs.map(c=>H3[c.k][0])))+F.map((e,j)=>{const k=ks[j];
  return'<tr class="'+(chk.has(k)?'s':'')+'" data-k="'+k+'"><td'+st(L[0],'n')+'><input type="checkbox"'+(chk.has(k)?' checked':'')+'></td>'+cs.map((c,x)=>'<td'+st(L[x+1],c.k=='ten'?'nm':'')+'>'+esc(H3[c.k][1](e))+'</td>').join('')+'</tr>'}).join('')+'</table>';
 mn.scrollLeft=sx;mn.scrollTop=sy;zoomApply();
 const c=()=>{$('#cnt').textContent='Đã chọn '+chk.size};c();
 $('#ta').onchange=e=>{ks.forEach(k=>e.target.checked?chk.add(k):chk.delete(k));list()};
 mn.querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>{const k=+tr.dataset.k;chk.has(k)?chk.delete(k):chk.add(k);tr.classList.toggle('s',chk.has(k));tr.querySelector('input').checked=chk.has(k);c()})}
function push(sh){if(!chk.size)return msg('Chưa tick mã nào ở Sheet3');snap();const R=S[sh],items=[...chk].sort((a,b)=>a-b).map(k=>({sku:D.list[k].sku,e:D.list[k],n:'1a6',err:''}));
 let last=-1;R.forEach((r,i)=>{if(r.sku)last=i});const pos=last<0?0:last+2;
 items.forEach((it,k)=>{if(pos+k<R.length)R[pos+k]=it;else R.push(it)});
 while(R.length<pos+items.length+3)R.push(blank());
 msg('Đã đẩy '+items.length+' mã sang '+sh+' từ dòng '+(pos+1));chk.clear();S.tab=sh;sel=new Set(items.map((_,k)=>pos+k));save();draw();
 const t=$('tr[data-i="'+pos+'"]');if(t)t.scrollIntoView({block:'center'});showFM(pos)}
/* ---------- A3 / A4 / A6 ---------- */
function grid(){const sh=S.tab,R=S[sh],G=grp(R,sh);
 const val=(r,i)=>{const e=r.e||{};return{nh:bn(e)||e.nh||'',ten:e.ten?e.ten+(r.tm?'':G[i].t||''):'',dvt:e.dvt,gia:fm(e.gia),goc:fm(e.goc),qt:e.qt,ad:e.ad,g:r.err||(r.g!==undefined?r.g:sh=='A6'?r.n:G[i].g||'')}};
 const V=R.map(val),K=[['sku','SKU',70],['nh','Nhãn',60],['ten','Tên hàng',300],['dvt','Quy cách',48],['gia','Giá bán',72],['goc','Giá gốc',72],['qt','Quà tặng',160],['ad','Áp dụng',210],['g','Ghi chú',110]];
 const cols=[{w:36,fz:1}].concat(K.map((k,x)=>({w:W(k[1],k[0]=='sku'?R.map(r=>r.sku):V.map(v=>v[k[0]]),k[2])+(k[0]=='sku'?0:6),fz:x==0}))),L=lay(cols);
 const mn=$('#main'),sx=mn.scrollLeft,sy=mn.scrollTop;mn.className=multi?'multi':'';
