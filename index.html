function mergeName(ns){const rx=/\d+/g,runs=ns.map(n=>n.match(rx)||[]),k=runs[0].length;if(!k||runs.some(r=>r.length!=k))return null;const sk=n=>n.replace(/\d+/g,'#');if(ns.some(n=>sk(n)!=sk(ns[0])))return null;
 let ix=-1;for(let j=k-1;j>=0;j--){if(runs.some(r=>r[j]!=runs[0][j])){ix=j;break}}if(ix<0)return null;
 const vals=[...new Set(runs.map(r=>r[ix]))].join('/');let c=-1;return ns[0].replace(rx,m=>(++c==ix)?vals:m)}
function doMerge(){const sh=S.tab,R=S[sh];let a=SL.r1,b=SL.r2;while(a>0&&R[a-1].sku)a--;while(b<R.length-1&&R[b+1].sku)b++;snap();const out=[];let n=0,i=a;

  run.forEach((r,k)=>{if(r.e){const key=[r.e.v,r.e.gia,r.e.goc].join('|');if(!bk.has(key))bk.set(key,[]);bk.get(key).push(k)}});
  const drop=new Set(),rep=new Map();bk.forEach(ix=>{if(ix.length<2)return;const nm=mergeName(ix.map(k=>String(run[k].e.ten)));if(!nm)return;rep.set(ix[0],{nm,skus:ix.slice(1).map(k=>run[k].sku)});ix.slice(1).forEach(k=>drop.add(k));n+=ix.length-1});
  run.forEach((r,k)=>{if(drop.has(k))return;if(rep.has(k)){const p=rep.get(k);r.e=Object.assign({},r.e,{ten:p.nm});r.mg=(r.mg||[]).concat(p.skus);r.tm=0}out.push(r)});i=j}

 R.splice(a,b-a+1,...out);SL=null;save();draw();msg('Đã ghép tên '+n+' dòng (dòng tô xanh viền). Hoàn tác được')}

 if(clip.rows){snap();const mv=CR&&CR.cut&&CR.rows&&CR.sh==S.tab,n=clip.rows.length;

function pasteM(m,ins){const sh=S.tab,R=S[sh],{r1,c1}=SL;snap();
 if(CR&&CR.cut&&!CR.rows&&CR.sh==sh){for(let i=CR.r1;i<=CR.r2;i++)for(let k=CR.c1;k<=CR.c2;k++)setF(sh,i,FK[k],'');CR=null}
