<!DOCTYPE html>
<!--
=== QUY TẮC GIAO DIỆN — ĐỌC TRƯỚC KHI SỬA, KHÔNG ĐƯỢC LÀM MẤT ===
1. "Có thao tác thì mới hiện nút": chỉ hiện nút/menu khi việc đó áp dụng được.
   - Cắt / Chép / Xóa: chỉ khi vùng chọn có dữ liệu.
   - Dán: chỉ khi có gì để dán (clipboard trong app, HOẶC clipboard ngoài app đọc được bằng navigator.clipboard.readText).
     Nếu trình duyệt chặn đọc clipboard (không biết có gì) thì vẫn hiện Dán, bấm vào sẽ mở ô dán tay (pasteBox).
   - "Tra N mã": chỉ khi vùng chọn có dòng lỗi (row.err) kèm nút Tra web. "Điền N mã": chỉ khi đã có kết quả tra (WQ.res) cho dòng lỗi trong vùng chọn.
   - Chạm vào ô trống mà không có gì để làm thì KHÔNG hiện hộp/menu nổi (showFM tự ẩn khi không có mục nào).
   - Bôi đen xong một dãy ô/dãy dòng (kéo tay cầm, chạm số dòng, tiêu đề cột) thì menu nổi tự mở ra.
2. Dán kiểu Excel: copy 1 ô rồi chọn nhiều ô → dán lặp ra hết vùng chọn (tileM / pasteIn). Dán dãy ô bình thường vẫn dán từ ô đầu.
3. Việc chạy lâu (tra web hàng loạt, ...) phải chạy NỀN và hiện tiến trình ĐAN NGAY TRONG BẢNG như Excel: trạng thái ở chính dòng đó (⏳ Đang tra… → ✍ Điền) và 1 chip ở dải thông tin trên cùng (wqChip). TUYỆT ĐỐI không dùng thanh/hộp nổi che lên dữ liệu, không dùng pop() che màn hình; người dùng vẫn thao tác tiếp được.
4. Mọi thay đổi dữ liệu đều snap() trước để Hoàn tác được.
5. "Thêm sang…" (mvPop/mvDo/insertAt) là SAO CHÉP mã sang tab khác, KHÔNG xóa ở tab nguồn.
6. Tên phiên đang mở luôn hiện ở chip đầu dải thông tin (sesChip): bấm vào tên chỉ để sửa tên ngay tại chip (Enter hoặc bấm ra ngoài là lưu, Esc là hủy) cho phiên đang mở (trên máy hoặc online; phiên online thì đổi tên xong lưu luôn lên sheet); mọi thao tác khác với phiên nằm ở nút Phiên; ＋ (không kèm chữ) để tạo phiên mới. Phiên (trên máy và online) đều lưu bằng sessData() và khôi phục bằng applySess(): bảng A3/A4/A6, dấu kiểm KM/KN/KD, tab nguồn Sheet3 (LS.src) và trạng thái kiểm bảng (quầy, A3/A4/A6/Tick, trang đang lật). Thêm gì cần lưu theo phiên thì sửa 2 hàm đó. Phiên trên máy tự lưu ngầm (autoLocal) sau mỗi thay đổi; phiên online chỉ lưu khi bấm lưu. Mở phiên online thì tách khỏi phiên trên máy để không ghi đè nhầm.
7. Dọn code: hàm/hằng/CSS không còn được gọi thì xóa, đừng để dư.
8. Nút kính lúp (#bf) nằm ở thanh tab dưới cùng cạnh Sheet3/A3/A4/A6 cho dễ bấm; KHÔNG đặt lại ở thanh trên và không dùng nút nổi đè lên bảng.
9. TƯƠNG THÍCH MỌI ĐIỆN THOẠI + MỌI HỆ ĐIỀU HÀNH (iPhone/iOS Safari, Android Chrome, Samsung Internet...): mọi tính năng mới phải chạy được trên cả hai, đừng chỉ thử trên một máy.
   - Ô nhập (input/textarea) cỡ chữ tối thiểu 16px, nếu không iOS tự phóng to khi chạm vào ô.
   - iOS KHÔNG tự gọi navigator.clipboard.readText (hiện bong bóng Dán, làm hỏng menu nổi): chỉ đọc clipboard khi người dùng bấm nút Dán.
   - Không dựa vào sự kiện contextmenu (iOS không bắn): nhấn giữ trên iOS tự nhận bằng touchstart + hẹn giờ 500ms (LPT).
   - Ghi localStorage luôn bọc try/catch (iOS đầy bộ nhớ hoặc chế độ riêng tư sẽ ném lỗi làm dừng cả draw()).
   - Hộp hỏi tự bật (ask6, askPend) không được bật khi ngón tay đang chạm, đang sửa ô hoặc đang có hộp khác: phải hẹn thử lại, không bỏ qua.
=================================================================
-->
