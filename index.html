 [...chk].sort((a,b)=>a-b).forEach(id=>{const e=D.list[id],L=D.idx[e.sku]||[e];
  if(L.length>1&&L.every(isMem)){if(seen.has(e.sku))return;seen.add(e.sku);memSort(L).forEach(x=>items.push({sku:x.sku,e:x,n:'1a6',err:''}))}else items.push({sku:e.sku,e,n:'1a6',err:''})});
 let last=-1;R.forEach((r,i)=>{if(r.sku)last=i});const gap=LS.gap&&last>=0,pos=last<0?0:last+1+(gap?1:0);
 if(gap&&R[last+1])R[last+1]=blank();
 items.forEach((it,k)=>{if(pos+k<R.length)R[pos+k]=it;else R.push(it)});while(R.length<pos+items.length+3)R.push(blank());
 {const cl=clusters(R,sh,true),ab=cl.reduce((n,c)=>n+c.ix.length-1,0),c6=sh=='A6'?clusters(R,'A6',false).filter(c=>c.ix.every(k=>!R[k].mg6&&!R[k].nm)).length:0;msg('Đã đẩy '+items.length+' dòng sang '+sh+' (dòng '+(pos+1)+' đến '+(pos+items.length)+')'+(gap?', cách 1 dòng':', nối đuôi')+(cl.length?' · tự ghép tên '+cl.length+' nhóm (gộp '+ab+' dòng)':'')+(c6?' · A6 có '+c6+' nhóm có thể ghép tên, mở A6 để chọn':''))}UN[sh]=(UN[sh]||0)+items.length;LS.un=JSON.stringify(UN);chk.clear();save();list();tabsDraw()}
/* ---------- A3 / A4 / A6 ---------- */
function grid(){const sh=S.tab,R=S[sh];{let l=-1;R.forEach((r,i)=>{if(r.sku)l=i});while(R.length<Math.max(60,l+30))R.push(blank())}VV=mkVal(sh);const G=GL;
 if(SL&&SL.r1>=R.length)SL=null;else if(SL)SL.r2=Math.min(SL.r2,R.length-1);
 const K=[['sku','SKU',110,1],['nh','Nhãn',120,0],['ten','Tên hàng',280,0],['dvt','Quy cách',70,1],['gia','Giá bán',90,1],['goc','Giá gốc',90,1],['qt','Quà tặng',170,0],['ad','Áp dụng',200,0],['g','Ghi chú / ghép',120,1]];
 const skuTxt=(r,i)=>r.sku+(PL[i]&&PL[i].name?' +'+(PL[i].n-1):''),tx=(r,i,k)=>k=='sku'?skuTxt(r,i):(k=='ten'&&r.err)?'⚠ '+r.err:(k=='g'&&G[i].big&&G[i].gs)?'⚠ '+VV[i].g+' (quá 10 mã)':VV[i][k];
 const RL=[],IN=[];{let i=0;while(i<R.length){if(!R[i].sku){i++;continue}let j=i;while(j<R.length&&R[j].sku)j++;RL[i]=j-i;for(let k=i+1;k<j;k++)IN[k]=1;i=j}}
 const cols=[{w:40,fz:1}].concat(K.map((k,x)=>({w:Math.max(k[0]=='g'?118:34,W2(k[1],R.map((r,i)=>tx(r,i,k[0])),k[2],k[3])+(x==0?4:0)),fz:x==0}))),L=lay(cols);
 const sx=M.scrollLeft,sy=M.scrollTop;M.className='g';
 M.innerHTML=head(cols,L,['#'].concat(K.map(k=>k[1])))+R.map((r,i)=>{const g=G[i]||{};
  return'<tr class="'+(r.err?'e ':'')+(r.warn?'w ':'')+(PL[i]&&PL[i].name?'mg ':'')+(g.ab?'ab ':'')+(g.big?'gw'+(g.gs?' gt':'')+(g.ge?' gb':''):'')+'"><td'+st(L[0],'n')+' data-r="'+i+'">'+(i+1)+'</td>'+
   K.map((k,x)=>{const grpc=k[0]=='g'&&sh!='A6',span=grpc&&RL[i]>1?' rowspan="'+RL[i]+'"':'';if(grpc&&IN[i])return'';
    return'<td'+st(L[x+1],(k[3]?'nw ':'')+(r.hl&&r.hl[k[0]]?'hl ':'')+(grpc?'gm':''))+span+' data-r="'+i+'" data-c="'+x+'">'+esc(tx(r,i,k[0]))+'</td>'}).join('')+'</tr>'}).join('')+'</table>';
 M.querySelectorAll('tr:first-child th').forEach((th,j)=>{if(j>0)th.dataset.c=j-1});
 M.scrollLeft=sx;M.scrollTop=sy;zoomApply();infoDraw();
 if(FL&&FL.sh==sh){const f=FL;FL=null;M.querySelectorAll('td[data-r]').forEach(td=>{const r=+td.dataset.r;if(r>=f.r1&&r<=f.r2)td.classList.add('fl')});XS=[];SL={r1:f.r1,r2:f.r2,c1:0,c2:8};setTimeout(()=>{const t=M.querySelector('td[data-r="'+f.r1+'"][data-c="0"]');if(t){const m=M.getBoundingClientRect(),r=t.getBoundingClientRect();if(r.top<m.top+36)M.scrollTop-=m.top+36-r.top;else if(r.bottom>m.bottom-6)M.scrollTop+=r.bottom-m.bottom+6}},30);setTimeout(()=>M.querySelectorAll('td.fl').forEach(x=>x.classList.remove('fl')),1600)}}
function goRow(i){const t=$('#main td[data-r="'+i+'"][data-c="0"]');if(t){t.scrollIntoView({block:'center'});pick(i,0,i,LASTC)}}
function stats(){const R=S[S.tab],P=PL,G=GL;const o={n:0,runs:0,abs:0,mg:0,big:0,err:0,warn:0,stale:0,mem:0,rows:0,e1:-1,b1:-1,w1:-1};
 R.forEach((r,i)=>{if(!r.sku)return;o.n++;if(r.err){o.err++;if(o.e1<0)o.e1=i}if(r.warn){o.warn++;if(o.w1<0)o.w1=i}
  if(P[i]&&P[i].abs!==undefined)o.abs++;else o.rows++;if(P[i]&&P[i].name)o.mg++;if(r.e&&isMem(r.e))o.mem++;
  if(G[i]&&G[i].gs){o.runs++;if(G[i].big){o.big++;if(o.b1<0)o.b1=i}}
  if(r.e){const L=D.idx[r.sku];if(L){const q=r.e,m=L.length==1?L[0]:(L.find(x=>x.qt==q.qt)||L.find(x=>x.gia==q.gia));if(m&&(m.gia!=q.gia||m.goc!=q.goc||m.qt!=q.qt||m.ad!=q.ad))o.stale++}}});return o}
function infoDraw(){const el=$('#info');if(!el)return;const tabc='<span class="ch btn" data-i="tab">📄 Tab: '+esc(LS.src||'chưa chọn')+' ▾</span>';
 if(S.tab=='Sheet3'){const dr=LF.filter(e=>!e.h).length;el.innerHTML='<span class="ch ok">'+dr+' / '+D.list.length+' mã'+(dr<D.list.length?' (đang lọc)':'')+'</span>'+(chk.size?'<span class="ch ok">đã chọn '+chk.size+'</span>':'')+tabc;return}
 const t=stats(),a6=S.tab=='A6';
 el.innerHTML='<span class="ch ok">'+t.n+' mã</span><span class="ch">in '+t.rows+' dòng</span>'+(a6?'':'<span class="ch">'+t.runs+' cụm ghép</span>')+(t.mg?'<span class="ch ok">ghép tên '+t.mg+' nhóm · gộp '+t.abs+' dòng</span>':'')+
  (t.big?'<span class="ch er btn" data-i="big">⚠ '+t.big+' cụm trên 10 mã</span>':'')+(t.err?'<span class="ch er btn" data-i="err">⚠ '+t.err+' mã không có trong file</span>':'')+(t.warn?'<span class="ch wn btn" data-i="warn">'+t.warn+' mã chờ chọn giá</span>':'')+
  (t.stale?'<span class="ch wn btn" data-i="sync">⟳ '+t.stale+' dòng giá đã đổi, bấm để cập nhật</span>':'')+(t.mem?'<span class="ch">thành viên '+t.mem+' dòng</span>':'')+tabc;
 el._st=t}
$('#info').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const k=b.dataset.i,t=$('#info')._st||{};
 if(k=='tab')return pickTab();if(k=='sync')return syncPrices();if(k=='err')return goRow(t.e1);if(k=='big')return goRow(t.b1);if(k=='warn')return goRow(t.w1)});
function zoomApply(){const t=$('#main table');if(t)t.style.zoom=Z[S.tab]||1}
const TC={Sheet3:'#3b6ea8',A3:'#1d8a63',A4:'#d9780b',A6:'#8b5cc4'};
function tabsDraw(){const t=$('#tabs');t.innerHTML=['Sheet3','A3','A4','A6'].map(x=>{const u=UN[x]||0;return'<button class="'+(x==S.tab?'on':u?'nw':'')+'" data-t="'+x+'" style="--tc:'+TC[x]+';--tcs:'+TC[x]+'22">'+x+(u&&x!=S.tab?'<i>+'+u+'</i>':'')+'</button>'}).join('');
 t.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(ED)closeEdit();S.tab=b.dataset.t;SL=null;delete UN[S.tab];LS.un=JSON.stringify(UN);draw();M.scrollTo(0,0)})}
function draw(){save();hideFM();bar();tabsDraw();
 if(S.tab=='Sheet3'){SL=null;if(ED)closeEdit();list()}else grid();paint();setTimeout(()=>{askPend();ask6()},60)}
/* chụm 2 ngón để zoom bảng, chặn zoom/tải lại cả trang */
const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);let pz=null;
M.addEventListener('touchstart',e=>{if(e.touches.length==2)pz={d:dist(e),z:Z[S.tab]||1}},{passive:true});
M.addEventListener('touchmove',e=>{if(pz&&e.touches.length==2){e.preventDefault();Z[S.tab]=Math.min(2.5,Math.max(.5,pz.z*dist(e)/pz.d));zoomApply()}},{passive:false});
M.addEventListener('touchend',e=>{if(pz&&e.touches.length<2){pz=null;LS.z=JSON.stringify(Z)}});
document.addEventListener('gesturestart',e=>e.preventDefault());
draw();load();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
